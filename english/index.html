<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>준서의 영어 놀이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Jua&display=swap">
<style>
/* Layout: one-column tablet app — home grid of 4 week tiles, each week a tabbed play space with huge tap targets */
:root{
  --bg:#EEF4FA; --paper:#FFFFFF; --ink:#1F2A44; --soft:#5B6782; --line:#D5DEEA;
  --w1:#E86A92; --w2:#5FA84A; --w3:#EE8A2B; --w4:#8B63C9;
  --w1s:#FCE6EE; --w2s:#E5F3DF; --w3s:#FDEBD8; --w4s:#EEE6F8;
  --good:#2E9E5B; --oops:#D9534F; --star:#F5B700;
  --en:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --ko:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A26; --paper:#1E2636; --ink:#EEF2F8; --soft:#A7B2C8; --line:#323D52;
  --w1s:#3A2230; --w2s:#223322; --w3s:#3A2A1A; --w4s:#2C2440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A26; --paper:#1E2636; --ink:#EEF2F8; --soft:#A7B2C8; --line:#323D52;
  --w1s:#3A2230; --w2s:#223322; --w3s:#3A2A1A; --w4s:#2C2440; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ko);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.en{font-family:var(--en)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--w4);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand small{color:var(--soft);font-size:15px}
.brand h1{font-size:clamp(26px,4vw,38px)}
.back{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:10px 18px;font-size:18px}
.stick{display:flex;gap:6px;align-items:center;background:var(--paper);border-radius:999px;padding:8px 14px;border:2px solid var(--line);font-size:16px}
.stick span{font-size:26px;opacity:.25;filter:grayscale(1)}
.stick span.on{opacity:1;filter:none}

/* home */
.hello{background:var(--paper);border-radius:24px;padding:18px 22px;display:flex;gap:16px;align-items:center;border:2px solid var(--line)}
.hello .big{font-size:56px}
.hello p{margin:0;font-size:18px;line-height:1.5;color:var(--soft)}
.hello b{color:var(--ink);font-weight:400}
.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:620px){.weeks{grid-template-columns:1fr}}
.wk{border-radius:28px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:190px;position:relative;border:3px solid transparent;transition:transform .15s}
.wk:active{transform:scale(.97)}
.wk .tag{font-family:var(--en);font-weight:600;color:#fff;border-radius:999px;padding:4px 14px;align-self:flex-start;font-size:16px;letter-spacing:.04em}
.wk h2{font-family:var(--en);font-weight:600;font-size:clamp(24px,3.4vw,32px);line-height:1.1}
.wk .ko{color:var(--soft);font-size:17px}
.wk .pics{font-size:42px;letter-spacing:4px;margin-top:auto}
.wk .done{position:absolute;top:14px;right:16px;font-size:34px}

/* week view */
.whead{border-radius:28px;padding:18px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.whead .pics{font-size:44px}
.whead h2{font-family:var(--en);font-weight:600;font-size:clamp(26px,4vw,36px)}
.whead p{margin:2px 0 0;color:var(--soft);font-size:17px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tab{background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px}
.tab .i{font-size:34px}
.tab[aria-selected="true"]{border-color:var(--c);background:var(--cs)}
.panel{background:var(--paper);border-radius:28px;padding:20px;border:2px solid var(--line);display:flex;flex-direction:column;gap:16px}
.hint{color:var(--soft);font-size:17px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{font-size:20px;color:var(--ink)}

/* word cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--cs);border-radius:22px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;transition:transform .12s}
.card:active,.card.say{transform:scale(.94);border-color:var(--c)}
.card .p{font-size:64px;line-height:1.1}
.card .w{font-family:var(--en);font-weight:600;font-size:24px}
.card .k{font-size:15px;color:var(--soft)}
.group{font-family:var(--en);font-weight:600;font-size:20px;color:var(--c)}

/* sentences */
.sents{display:flex;flex-direction:column;gap:10px}
.sent{display:flex;align-items:center;gap:12px;background:var(--cs);border-radius:20px;padding:12px 14px;text-align:left}
.sent .p{font-size:40px;flex:none}
.sent .t{display:flex;flex-direction:column;min-width:0;flex:1}
.sent .t b{font-family:var(--en);font-weight:600;font-size:clamp(20px,3vw,26px)}
.sent .t span{color:var(--soft);font-size:15px}
.sent .sp{flex:none;display:flex;gap:6px}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:22px;line-height:1}
.chip small{display:block;font-size:11px;color:var(--soft);margin-top:2px;font-family:var(--ko)}
.talk{border:3px dashed var(--c);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.talk .row{display:flex;gap:10px;align-items:center}
.talk .who{font-size:30px;flex:none}
.talk .bub{background:var(--cs);border-radius:16px;padding:10px 14px;font-family:var(--en);font-size:21px;font-weight:500}

/* games */
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.bigpic{font-size:110px;line-height:1}
.prompt{font-family:var(--en);font-weight:600;font-size:clamp(24px,3.6vw,32px)}
.opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.opt{background:var(--cs);border:4px solid transparent;border-radius:24px;padding:14px 18px;min-width:130px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:18px}
.opt .p{font-size:70px;line-height:1.1}
.opt .w{font-family:var(--en);font-weight:600;font-size:20px}
.opt.right{border-color:var(--good);animation:pop .4s}
.opt.wrong{border-color:var(--oops);animation:shake .35s}
.btn{background:var(--c);color:#fff;border-radius:999px;padding:14px 26px;font-size:20px;font-family:var(--en);font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:var(--paper);color:var(--ink);border:3px solid var(--c)}
.btn .ko{font-family:var(--ko);font-weight:400;font-size:16px;opacity:.9}
.feedback{min-height:40px;font-family:var(--en);font-size:26px;font-weight:600}
.feedback.good{color:var(--good)} .feedback.oops{color:var(--oops)}
.stars{font-size:34px;letter-spacing:4px;min-height:40px}
.mode{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mode .btn{padding:10px 18px;font-size:17px}

/* face (week 1) */
.face{width:min(240px,60vw);height:auto}
.feelbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.feelbar button{font-size:54px;background:var(--cs);border-radius:20px;padding:6px 12px;border:3px solid transparent}
.feelbar button[aria-pressed="true"]{border-color:var(--c)}

/* plate (week 2) */
.plate{width:min(300px,76vw);aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--paper);border:12px solid var(--cs);box-shadow:inset 0 0 0 3px var(--line);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:30px;font-size:46px}
.pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pick button{font-size:44px;background:var(--cs);border-radius:16px;padding:4px 10px}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.basket{border-radius:24px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border:4px solid}
.basket .p{font-size:52px}
.basket b{font-family:var(--en);font-weight:600;font-size:21px}
.basket span{font-size:15px;color:var(--soft)}
.b-day{background:var(--w2s);border-color:var(--w2)}
.b-some{background:var(--w3s);border-color:var(--w3)}

/* tree (week 4) */
.tree{position:relative;width:min(340px,82vw);max-width:100%;aspect-ratio:1}
.tree svg{width:100%;height:100%}
.leaf{position:absolute;font-size:38px;transform:translate(-50%,-50%);animation:pop .4s}
.cookies{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%}
.pile{background:var(--cs);border-radius:22px;padding:12px;min-width:150px;min-height:120px;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:260px}
.pile .who{font-size:44px}
.pile .c{font-size:34px;min-height:40px;word-break:break-all}

.guide{background:var(--paper);border:2px dashed var(--line);border-radius:22px;padding:4px 18px}
.guide summary{cursor:pointer;font-size:18px;padding:12px 0;color:var(--soft)}
.guide ul{margin:0 0 14px;padding-left:20px;line-height:1.7;font-size:16px}
.guide b{font-family:var(--en);font-weight:600}
.notts{background:var(--w3s);border-radius:14px;padding:10px 14px;font-size:15px}

.miso{display:flex;align-items:center;gap:10px;min-width:0}
.bun{width:76px;flex:none}
.bun svg{width:100%;height:auto;display:block}
.bun.hop{animation:hop .5s}
.bubble{background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:10px 16px;font-size:clamp(18px,2.6vw,24px);font-weight:600;position:relative;min-width:0;overflow-wrap:anywhere}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;width:16px;height:16px;background:inherit;border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.hello .miso{flex:1}
.whead .miso{margin-left:auto}
@media (max-width:620px){.whead .miso{margin-left:0;width:100%}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.leaf{animation-name:leafpop}
@keyframes leafpop{0%{transform:translate(-50%,-50%) scale(.3)}100%{transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

  sents:[['🍎','I like apples.','나는 사과를 좋아해.'],['🥕',"I don't like carrots.",'나는 당근을 안 좋아해.'],['🥦','This is healthy.','이건 건강에 좋아.'],['🍬','Candy is a sometimes food.','사탕은 가끔 먹는 음식이야.'],['🥛','I want some milk.','우유 먹고 싶어.'],['😋',"It's yummy!",'맛있어!'],['🍽️',"Let's eat together.",'같이 먹자.']],

   {name:'I am thankful for…',items:[['my family','우리 가족','👨‍👩‍👦'],['my mom','엄마','👩'],['my dad','아빠','👨'],['my friends','친구들','🧒'],['my teacher','선생님','🧑‍🏫'],['my toys','장난감','🧸'],['food','음식','🍚'],['my home','우리 집','🏠']]}],
  sents:[['🙏','Thank you.','고마워요.'],['👨‍👩‍👦','I am thankful for my family.','나는 우리 가족에게 감사해요.'],['🍪',"Let's share.",'같이 나눠 먹자.'],['🍪','One for you, one for me.','하나는 너, 하나는 나.'],['😊',"You're welcome.",'천만에요.'],['🦃','Happy Thanksgiving!','즐거운 추수감사절!']],
  talk:[['👩','Here you are.'],['🧒','Thank you!'],['👩',"You're welcome."],['🧒',"Let's share, Mom!"]],
  guide:['잠들기 전 <b>I am thankful for ___</b> 하나씩 말하기를 습관으로 만들어 보세요.','과자를 나눌 때 <b>One for you, one for me</b>를 꼭 함께 말해 주세요.','감사 나무에 고른 것을 종이 나뭇잎에 그려서 실제 벽에 붙이면 수업 활동과 연결돼요.']}

// ---------- speech ----------
let voice=null, ttsOK='speechSynthesis' in window;
function pickVoice(){ if(!ttsOK) return; const v=speechSynthesis.getVoices();
  voice=v.find(x=>/en-US/i.test(x.lang)&&/Samantha|Google US|Aria|Jenny/i.test(x.name))||v.find(x=>/en-US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;}

function speakTTS(t,slow){return new Promise(res=>{ if(!ttsOK) return res(); try{const u=new SpeechSynthesisUtterance(t);

async function say(lines,slow){ const id=++queueId; lines=[].concat(lines);
  try{ if(player){player.pause();player=null} if(ttsOK) speechSynthesis.cancel(); }catch(e){}
  for(const t of lines){ if(id!==queueId) return; mascotSay(t); await (AUDIO_READY.has(slug(t))?playFile(t,slow):speakTTS(t,slow)); } }

let actx=null;
function sfx(kind){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const now=actx.currentTime;
  const notes=kind==='good'?[660,880,1320]:kind==='win'?[523,659,784,1046,1318]:[300,220];
  notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=kind==='oops'?'triangle':'sine';o.frequency.value=f;
    const s=now+i*(kind==='win'?0.12:0.09);g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.18,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.25);
    o.connect(g).connect(actx.destination);o.start(s);o.stop(s+0.3)}); }catch(e){} }
function confetti(n=60){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.createElement('canvas');c.className='confetti';document.body.append(c);const x=c.getContext('2d');
  const W=c.width=innerWidth,H=c.height=innerHeight;const cols=['#E86A92','#5FA84A','#EE8A2B','#8B63C9','#F5B700','#4AA3DF'];
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*6)],a:Math.random()*6}));
  let f=0;(function loop(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});
    if(++f<90)requestAnimationFrame(loop);else c.remove()})(); }

const FEEL=['happy','sad','angry','sleepy','scared','surprised'], BODY=['eyes','nose','mouth','ears','hands','feet','head','tummy'], PLURAL=['eyes','ears','hands','feet','grapes','french fries','my friends','my toys'];
const whereQ=n=>{ if(FEEL.includes(n)) return `Who is ${n}?`; const be=PLURAL.includes(n)?'are':'is';
  if(BODY.includes(n)) return `Where ${be} your ${n}?`; if(/^my /.test(n)) return `Where ${be} ${n}?`; return `Where ${be} the ${n}?`; };
function tabQuiz(w,p){
  const pool=allItems(w); let q=0, score=0; const N=5, qs=shuffle(pool).slice(0,N);
  p.innerHTML=`<div class="stage"><p class="hint sub">듣고 맞는 그림을 눌러요!</p>
    <div class="stars" id="stars"></div><div class="prompt" id="pr"></div>
    <button class="btn ghost" id="again">🔊 다시 듣기</button><div class="opts" id="opts"></div><div class="feedback" id="fb"></div></div>`;
  const pr=p.querySelector('#pr'),opts=p.querySelector('#opts'),fb=p.querySelector('#fb'),st=p.querySelector('#stars');
  p.querySelector('#again').onclick=()=>say(pr.textContent);
  function ask(){
    if(q>=N) return finish();
    const ans=qs[q]; const set=shuffle([ans,...shuffle(pool.filter(x=>x!==ans)).slice(0,2)]);
    pr.textContent=whereQ(ans[0]); fb.textContent=''; fb.className='feedback';
    st.textContent='⭐'.repeat(score)+'☆'.repeat(N-q);
    opts.innerHTML=''; let locked=false, tries=0;
    set.forEach(it=>{const b=$(`<button class="opt"><span class="p">${it[2]}</span></button>`);
      b.onclick=()=>{ if(locked) return;
        if(it===ans){locked=true;b.classList.add('right');b.append($(`<span class="w">${it[0]}</span>`));
          if(tries===0)score++; const pz=praise(); fb.textContent=pz; fb.classList.add('good'); sfx('good'); confetti(30);
          say([pz,it[0]]); st.textContent='⭐'.repeat(score)+'☆'.repeat(N-q-1); q++; setTimeout(ask,2000);}
        else{tries++;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');sfx('oops');fb.textContent='Try again!';fb.className='feedback oops';say([it[0],'Try again!']);}
      }; opts.append(b)});
    setTimeout(()=>say(pr.textContent),300);
  }
  function finish(){
    setDone(w.id); sfx('win'); confetti(140);
    p.innerHTML=`<div class="stage"><div class="bigpic">${STK[w.id-1]}</div><div class="prompt">You did it, Junseo!</div>
      <p class="hint sub">${score} / ${N} 첫 번에 맞혔어요. WEEK ${w.id} 스티커를 받았어요!</p>
      <button class="btn" id="re">한 번 더 하기</button></div>`;
    say('You did it, Junseo! Here is your sticker!');
    document.querySelector('.stick').outerHTML=stickerBar();
    p.querySelector('#re').onclick=()=>tabQuiz(w,p);
  }
  ask();
}

    g.innerHTML=`<div class="stage"><p class="hint sub">기분을 고르면 얼굴이 바뀌어요. 준서도 같은 표정을 지어 봐요!</p>
      <div id="fc">${faceSVG(k)}</div><div class="prompt" id="fl">I'm happy!</div>
      <div class="feelbar">${Object.entries(FACES).map(([n,f])=>`<button data-k="${n}" aria-pressed="${n===k}" aria-label="${n}">${f.e}</button>`).join('')}</div>
      <button class="btn ghost" id="ask">🤔 How do you feel?</button></div>`;
    g.querySelectorAll('.feelbar button').forEach(b=>b.onclick=()=>{k=b.dataset.k;g.querySelectorAll('.feelbar button').forEach(x=>x.setAttribute('aria-pressed',x===b));
      g.querySelector('#fc').innerHTML=faceSVG(k);g.querySelector('#fl').textContent=`I'm ${k}!`;say(`I'm ${k}!`)});
    g.querySelector('#ask').onclick=()=>say('How do you feel?');}
  function simon(){const parts=WEEKS[0].groups[0].items;
    g.innerHTML=`<div class="stage"><p class="hint sub">듣고 몸을 만져요! 만졌으면 ✅를 눌러요.</p><div class="bigpic" id="sp">🙆‍♂️</div>
      <div class="prompt" id="st">Ready?</div><div class="opts"><button class="btn" id="go">▶ Start</button><button class="btn ghost" id="ok" hidden>✅ I did it!</button></div><div class="stars" id="fb"></div></div>`;
    let n=0;const go=g.querySelector('#go'),ok=g.querySelector('#ok');
    function next(){const it=parts[Math.floor(Math.random()*parts.length)];const t=`Touch your ${it[0]}!`;
      g.querySelector('#sp').textContent=it[2];g.querySelector('#st').textContent=t;say(t);go.hidden=true;ok.hidden=false;}
    go.onclick=next; ok.onclick=()=>{n++;g.querySelector('#fb').textContent='⭐'.repeat(Math.min(n,10));sfx('good');if(n%5===0)confetti(60);say(praise());setTimeout(next,1500)};}
  feel();
}

// ---------- WEEK 2 play ----------
const SOMETIMES=['candy','pizza','ice cream','french fries'];
function playFood(w,p){
  const items=allItems(w); const g=modes(p,'🧺 Every day or Sometimes?','🍽️ My Healthy Plate',sort,plate);
  function sort(){
    const deck=shuffle([...items.filter(i=>SOMETIMES.includes(i[0])),...shuffle(items.filter(i=>!SOMETIMES.includes(i[0]))).slice(0,6)]);let i=0,ok=0;
    g.innerHTML=`<div class="stage"><p class="hint sub">매일 먹어도 좋은 음식일까, 가끔 먹는 음식일까?</p>
      <div class="bigpic" id="fd"></div><div class="prompt" id="fn"></div>
      <div class="baskets"><button class="basket b-day" data-a="d"><span class="p">💪</span><b>Every day</b><span>매일 먹어요</span></button>
      <button class="basket b-some" data-a="s"><span class="p">🎈</span><b>Sometimes</b><span>가끔 먹어요</span></button></div>
      <div class="feedback" id="fb"></div><div class="stars" id="sc"></div></div>`;
    function show(){ if(i>=deck.length){sfx('win');confetti(120);g.querySelector('.stage').innerHTML=`<div class="bigpic">🥗</div><div class="prompt">Great sorting!</div><p class="hint sub">${ok}개 맞혔어요!</p><button class="btn" id="r">다시 하기</button>`;say('Great sorting, Junseo!');g.querySelector('#r').onclick=sort;return;}
      const it=deck[i];g.querySelector('#fd').textContent=it[2];g.querySelector('#fn').textContent=it[0];g.querySelector('#fb').textContent='';say(it[0]);}
    g.querySelectorAll('.basket').forEach(b=>b.onclick=()=>{const it=deck[i];if(!it)return;const some=SOMETIMES.includes(it[0]);const fb=g.querySelector('#fb');
      if((b.dataset.a==='s')===some){ok++;sfx('good');fb.className='feedback good';const t=some?sometimesLine(it[0]):'Yes! This is healthy!';fb.textContent=t;
        say(t);g.querySelector('#sc').textContent='⭐'.repeat(ok);i++;setTimeout(show,2000);}
      else{sfx('oops');fb.className='feedback oops';fb.textContent='Hmm, try again!';say('Hmm, try again!');}});
    show();}
  function plate(){const on=[];
    g.innerHTML=`<div class="stage"><p class="hint sub">좋아하는 건강한 음식을 골라 식판을 채워요 (최대 6개)</p>
      <div class="plate" id="pl"></div><div class="pick">${items.map((it,ix)=>`<button data-i="${ix}" aria-label="${it[0]}">${it[2]}</button>`).join('')}</div>
      <div class="opts"><button class="btn" id="read">📣 This is my plate!</button><button class="btn ghost" id="clr">비우기</button></div><div class="feedback" id="fb"></div></div>`;
    const pl=g.querySelector('#pl'),fb=g.querySelector('#fb');
    g.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{const it=items[b.dataset.i];
      if(on.length>=6){fb.className='feedback oops';fb.textContent='My plate is full!';say('My plate is full!');return;}
      on.push(it);pl.append($(`<span>${it[2]}</span>`));say(`I have ${it[3]}.`);fb.textContent='';});
    g.querySelector('#clr').onclick=()=>{on.length=0;pl.innerHTML='';fb.textContent=''};
    g.querySelector('#read').onclick=()=>{if(!on.length){say('Choose some food!');return;}
      const names=[...new Set(on.map(x=>x[3]))]; const some=on.some(x=>SOMETIMES.includes(x[0]));const end=some?'Some are sometimes food!':"It's healthy!";
      fb.className='feedback good';fb.textContent=end;sfx('win');confetti(80);say(['This is my healthy plate.',...names.map(n=>`I have ${n}.`),end]);};}
  sort();
}
const cap=s=>s[0].toUpperCase()+s.slice(1);
const sometimesLine=n=>`${cap(n)} ${PLURAL.includes(n)?'are':'is'} a sometimes food.`;

// ---------- WEEK 3 play ----------
const WORKS=[['doctor','hospital'],['teacher','school'],['firefighter','fire station'],['police officer','police station'],['chef','restaurant'],['farmer','farm'],['baker','bakery']];
function playTown(w,p){
  const H=Object.fromEntries(w.groups[0].items.map(i=>[i[0],i])),P=Object.fromEntries(w.groups[1].items.map(i=>[i[0],i]));
  const g=modes(p,'🏘️ Who works here?','🌟 I want to be…',who,be);
  function who(){const deck=shuffle(WORKS).slice(0,5);let i=0,ok=0;
    g.innerHTML=`<div class="stage"><p class="hint sub">이곳에서 일하는 사람은 누구일까요?</p><div class="bigpic" id="pc"></div><div class="prompt" id="pq"></div>
      <div class="opts" id="op"></div><div class="feedback" id="fb"></div><div class="stars" id="sc"></div></div>`;
    function show(){if(i>=deck.length){sfx('win');confetti(120);g.querySelector('.stage').innerHTML=`<div class="bigpic">🏘️</div><div class="prompt">You know my town!</div><button class="btn" id="r">다시 하기</button>`;say('Wow! You know my town!');g.querySelector('#r').onclick=who;return;}
      const [h,pl]=deck[i];const q=`Who works at the ${pl}?`;g.querySelector('#pc').textContent=P[pl][2];g.querySelector('#pq').textContent=q;g.querySelector('#fb').textContent='';say(q);
      const op=g.querySelector('#op');op.innerHTML='';let locked=false;
      shuffle([h,...shuffle(WORKS.map(x=>x[0]).filter(x=>x!==h)).slice(0,2)]).forEach(n=>{const b=$(`<button class="opt"><span class="p">${H[n][2]}</span><span class="w">${n}</span></button>`);
        b.onclick=()=>{if(locked)return;const fb=g.querySelector('#fb');if(n===h){locked=true;b.classList.add('right');ok++;sfx('good');fb.className='feedback good';const ans=`The ${h} works at the ${pl}!`;fb.textContent=ans;say(ans);g.querySelector('#sc').textContent='⭐'.repeat(ok);i++;setTimeout(show,2600);}
          else{b.classList.add('wrong');sfx('oops');fb.className='feedback oops';fb.textContent='Try again!';say([n,'Try again!']);}};op.append(b)});}
    show();}
  function be(){g.innerHTML=`<div class="stage"><p class="hint sub">커서 무엇이 되고 싶어? 눌러서 말해 봐요!</p><div class="bigpic" id="me">🧒</div><div class="prompt" id="mt">What do you want to be?</div>
      <div class="opts">${w.groups[0].items.map((it,ix)=>`<button class="opt" data-i="${ix}"><span class="p">${it[2]}</span><span class="w">${it[0]}</span></button>`).join('')}</div></div>`;
    say('What do you want to be?');
    g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const it=w.groups[0].items[b.dataset.i];const t=`I want to be ${art(it[0])}!`;g.querySelector('#me').textContent=it[2];g.querySelector('#mt').textContent=t;say(t)});}
  who();
}

// ---------- WEEK 4 play ----------
const SPOTS=[[50,22],[30,30],[70,30],[20,46],[42,40],[60,42],[80,48],[33,56],[67,58],[50,54]];
const NUM=['zero','one','two','three'];
function playThanks(w,p){
  const g=modes(p,'🌳 Thankful Tree',"🍪 Let's Share",tree,share);
  function tree(){const list=w.groups[1].items;let n=0;
    g.innerHTML=`<div class="stage"><p class="hint sub">고마운 것을 누르면 감사 나무에 나뭇잎이 달려요</p>
      <div class="tree" id="tr"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M46 96 L47 62 Q38 54 28 50 M47 62 Q52 50 50 38 M48 70 Q60 60 72 54" stroke="#8B5A2B" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M42 96 L58 96 L54 60 L46 60 Z" fill="#8B5A2B"/></svg></div>
      <div class="prompt" id="tt">I am thankful for…</div>
      <div class="opts">${list.map((it,ix)=>`<button class="opt" data-i="${ix}"><span class="p">${it[2]}</span><span class="w">${it[0]}</span></button>`).join('')}</div>
      <button class="btn ghost" id="cl">나무 비우기</button></div>`;
    const tr=g.querySelector('#tr');
    g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const it=list[b.dataset.i];const t=`I am thankful for ${it[0]}.`;g.querySelector('#tt').textContent=t;say(t);sfx('good');
      if(n<SPOTS.length){const [x,y]=SPOTS[n++];const l=$(`<span class="leaf">${['🍂','🍁','🍃'][n%3]}</span>`);l.style.left=x+'%';l.style.top=y+'%';tr.append(l);
        const m=$(`<span class="leaf" style="font-size:22px">${it[2]}</span>`);m.style.left=x+'%';m.style.top=(y+7)+'%';tr.append(m);if(n===SPOTS.length)confetti(100);}});
    g.querySelector('#cl').onclick=tree;}
  function share(){let left=6,you=0,me=0,turn=0;
    g.innerHTML=`<div class="stage"><p class="hint sub">쿠키를 눌러서 친구랑 사이좋게 나눠요</p><div class="prompt" id="sh">Let's share!</div>
      <div class="pile" style="max-width:none;width:100%"><div class="c" id="jar"></div></div>
      <div class="cookies"><div class="pile"><span class="who">🧒</span><span>Friend</span><div class="c" id="y"></div></div><div class="pile"><span class="who">😊</span><span>Junseo</span><div class="c" id="m"></div></div></div>
      <button class="btn ghost" id="r">다시 하기</button></div>`;
    const jar=g.querySelector('#jar');function draw(){jar.innerHTML='';for(let k=0;k<left;k++){const b=$(`<button style="font-size:48px" aria-label="cookie">🍪</button>`);b.onclick=give;jar.append(b)}
      g.querySelector('#y').textContent='🍪'.repeat(you);g.querySelector('#m').textContent='🍪'.repeat(me);}
    function give(){left--;let t;if(turn%2===0){you++;t='One for you!'}else{me++;t='One for me!'}turn++;sfx('good');
      const lines=[t]; if(left===0){lines.push("We have three each. Yay! Let's eat together!");sfx('win');confetti(100);}
      g.querySelector('#sh').textContent=left?t:'Same, same! 😊';say(lines);draw();}
    say("Let's share!");g.querySelector('#r').onclick=share;draw();}
  tree();
}

// ---------- every line the page can say (for the recording script) ----------
function lineList(){const L=new Set(["Hi, Junseo! I'm Miso. Let's play!",'You did it, Junseo! Here is your sticker!','Try again!','Hmm, try again!',...PRAISE]);
  WEEKS.forEach(w=>{L.add(w.title);allItems(w).forEach(i=>{L.add(i[0]);L.add(whereQ(i[0]))});w.sents.forEach(s=>L.add(s[1]));w.talk.forEach(t=>L.add(t[1]));});
  Object.keys(FACES).forEach(k=>L.add(`I'm ${k}!`));L.add('How do you feel?');
  WEEKS[0].groups[0].items.forEach(i=>L.add(`Touch your ${i[0]}!`));
  const f=allItems(WEEKS[1]);SOMETIMES.forEach(s=>L.add(sometimesLine(s)));f.forEach(i=>L.add(`I have ${i[3]}.`));
  ['Yes! This is healthy!','Great sorting, Junseo!','My plate is full!','Choose some food!','This is my healthy plate.','Some are sometimes food!',"It's healthy!"].forEach(x=>L.add(x));
  WORKS.forEach(([h,p])=>{L.add(`Who works at the ${p}?`);L.add(`The ${h} works at the ${p}!`)});['Wow! You know my town!','What do you want to be?'].forEach(x=>L.add(x));
  WEEKS[2].groups[0].items.forEach(i=>L.add(`I want to be ${art(i[0])}!`));
  WEEKS[3].groups[1].items.forEach(i=>L.add(`I am thankful for ${i[0]}.`));["Let's share!",'One for you!','One for me!',"We have three each. Yay! Let's eat together!"].forEach(x=>L.add(x));
  return [...L];}
window.voiceLines=()=>lineList().map(t=>({file:slug(t)+'.mp3',text:t}));

function route(){const m=location.hash.match(/^#week([1-4])$/);window.scrollTo(0,0);m?week(+m[1]):(app.removeAttribute('style'),home());}
window.addEventListener('hashchange',route);route();
</script>
</html>
